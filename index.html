<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --muted: #888;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    padding: 24px; max-width: 1200px; margin: 0 auto;
  }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .subtitle { color: var(--muted); margin-bottom: 32px; font-size: 14px; }
  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 16px; margin-bottom: 32px;
  }
  .stat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .stat-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .stat-card .value { font-size: 32px; font-weight: 700; margin-top: 4px; }
  .stat-card .unit { font-size: 14px; color: var(--muted); font-weight: 400; }
  .chart-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
    gap: 24px; margin-bottom: 32px;
  }
  .chart-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px;
  }
  .chart-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .full-width { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: rgba(255,255,255,.03); }
  .type-badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600;
  }
</style>

const TYPE_COLORS = {
  'Fuerza Funcional': '#6366f1',
  'Fuerza Tradicional': '#8b5cf6',
  'Running': '#22c55e',
  'Caminata': '#3b82f6',
  'Ciclismo': '#f97316',
  'Yoga': '#ec4899',
  'HIIT': '#ef4444',
  'Core': '#14b8a6',
  'Natación': '#06b6d4',
};
function colorFor(label) { return TYPE_COLORS[label] || '#888'; }

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('es-AR', { weekday:'short', day:'numeric', month:'short' });
}

const workouts = WORKOUTS.map(w => ({ ...w, startDate: new Date(w.start) }));
const types = [...new Set(workouts.map(w => w.type))];

const totalSessions = workouts.length;
const totalMin = workouts.reduce((s, w) => s + w.duration, 0);
const totalKcal = workouts.reduce((s, w) => s + w.kcal, 0);
const totalDist = workouts.reduce((s, w) => s + w.dist_km, 0);
const avgDuration = totalSessions ? totalMin / totalSessions : 0;
const weeks = Math.max(1, Math.ceil((workouts[workouts.length-1].startDate - workouts[0].startDate) / (7*864e5)));
const perWeek = (totalSessions / weeks).toFixed(1);

const first = workouts[0].startDate.toLocaleDateString('es-AR');
const last = workouts[workouts.length-1].startDate.toLocaleDateString('es-AR');

document.getElementById('app').innerHTML = `
  <h1>🏋️ Mis Entrenamientos 2026</h1>
  <p class="subtitle">${first} — ${last} · ${totalSessions} sesiones · Fuente: ${[...new Set(workouts.map(w=>w.source))].join(', ')}</p>

  <div class="stats-row">
    <div class="stat-card"><div class="label">Sesiones</div><div class="value">${totalSessions}</div></div>
    <div class="stat-card"><div class="label">Horas totales</div><div class="value">${(totalMin/60).toFixed(0)}<span class="unit"> hs</span></div></div>
    <div class="stat-card"><div class="label">Promedio / sesión</div><div class="value">${avgDuration.toFixed(0)}<span class="unit"> min</span></div></div>
    <div class="stat-card"><div class="label">Sesiones / semana</div><div class="value">${perWeek}</div></div>
    <div class="stat-card"><div class="label">Calorías</div><div class="value">${(totalKcal/1000).toFixed(1)}<span class="unit">k</span></div></div>
    ${totalDist > 0 ? `<div class="stat-card"><div class="label">Distancia</div><div class="value">${totalDist.toFixed(0)}<span class="unit"> km</span></div></div>` : ''}
  </div>

  <div class="chart-grid">
    <div class="chart-card"><h2>Sesiones por semana</h2><canvas id="weeklyChart"></canvas></div>
    <div class="chart-card"><h2>Distribución por tipo</h2><canvas id="typeChart"></canvas></div>
    <div class="chart-card"><h2>Duración por sesión</h2><canvas id="durationChart"></canvas></div>
    <div class="chart-card"><h2>Volumen mensual (horas)</h2><canvas id="monthlyChart"></canvas></div>
    <div class="chart-card full-width"><h2>Heatmap de actividad</h2><canvas id="heatmapChart" height="160"></canvas></div>
  </div>

  <div class="chart-card full-width" style="margin-bottom:32px">
    <h2>Todos los entrenamientos (${workouts.length})</h2>
    <table>
      <thead><tr><th>Fecha</th><th>Tipo</th><th>Duración</th><th>Calorías</th><th>Distancia</th><th>Fuente</th></tr></thead>
      <tbody>
        ${workouts.slice().reverse().map(w => `
          <tr>
            <td>${fmtDate(w.start)}</td>
            <td><span class="type-badge" style="background:${colorFor(w.type)}22;color:${colorFor(w.type)}">${w.type}</span></td>
            <td>${w.duration.toFixed(0)} min</td>
            <td>${w.kcal ? w.kcal + ' kcal' : '—'}</td>
            <td>${w.dist_km > 0 ? w.dist_km + ' km' : '—'}</td>
            <td style="color:var(--muted)">${w.source}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>
`;

Chart.defaults.color = '#888';
Chart.defaults.borderColor = '#2a2a2a';

// ── Weekly sessions (stacked bar) ──
const weeklyData = {};
workouts.forEach(w => {
  const d = new Date(w.startDate);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // Monday
  const key = d.toISOString().slice(0, 10);
  if (!weeklyData[key]) weeklyData[key] = {};
  weeklyData[key][w.type] = (weeklyData[key][w.type] || 0) + 1;
});
const weekKeys = Object.keys(weeklyData).sort();
new Chart(document.getElementById('weeklyChart'), {
  type: 'bar',
  data: {
    labels: weekKeys.map(k => new Date(k).toLocaleDateString('es-AR', { day:'numeric', month:'short' })),
    datasets: types.map(t => ({
      label: t, backgroundColor: colorFor(t), borderRadius: 4,
      data: weekKeys.map(k => weeklyData[k][t] || 0),
    }))
  },
  options: {
    responsive: true,
    plugins: { legend: { position:'bottom', labels: { boxWidth: 12 } } },
    scales: { x: { stacked: true, ticks: { maxTicksLimit: 15 } }, y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 } } }
  }
});

// ── Type doughnut ──
const typeCounts = {};
workouts.forEach(w => typeCounts[w.type] = (typeCounts[w.type] || 0) + 1);
const tLabels = Object.keys(typeCounts).sort((a,b) => typeCounts[b] - typeCounts[a]);
new Chart(document.getElementById('typeChart'), {
  type: 'doughnut',
  data: {
    labels: tLabels,
    datasets: [{ data: tLabels.map(t => typeCounts[t]), backgroundColor: tLabels.map(colorFor), borderWidth: 0 }]
  },
  options: { responsive: true, cutout: '60%', plugins: { legend: { position:'bottom', labels: { boxWidth: 12 } } } }
});

// ── Duration scatter ──
new Chart(document.getElementById('durationChart'), {
  type: 'scatter',
  data: {
    datasets: types.map(t => ({
      label: t, backgroundColor: colorFor(t) + 'cc', pointRadius: 5,
      data: workouts.filter(w => w.type === t).map(w => ({ x: w.startDate, y: w.duration })),
    }))
  },
  options: {
    responsive: true,
    plugins: { legend: { position:'bottom', labels: { boxWidth: 12 } } },
    scales: {
      x: { type: 'time', time: { unit: 'month' } },
      y: { beginAtZero: true, title: { display: true, text: 'Minutos' } }
    }
  }
});

// ── Monthly volume (stacked bar) ──
const monthlyData = {};
workouts.forEach(w => {
  const key = w.date.slice(0, 7);
  if (!monthlyData[key]) monthlyData[key] = {};
  monthlyData[key][w.type] = (monthlyData[key][w.type] || 0) + w.duration;
});
const monthKeys = Object.keys(monthlyData).sort();
new Chart(document.getElementById('monthlyChart'), {
  type: 'bar',
  data: {
    labels: monthKeys.map(k => { const [y,m] = k.split('-'); return new Date(y, m-1).toLocaleDateString('es-AR', { month:'short', year:'2-digit' }); }),
    datasets: types.map(t => ({
      label: t, backgroundColor: colorFor(t), borderRadius: 4,
      data: monthKeys.map(k => +((monthlyData[k][t] || 0) / 60).toFixed(1)),
    }))
  },
  options: {
    responsive: true,
    plugins: { legend: { position:'bottom', labels: { boxWidth: 12 } } },
    scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Horas' } } }
  }
});

// ── Heatmap (canvas) ──
const dayMap = {};
workouts.forEach(w => { dayMap[w.date] = (dayMap[w.date] || 0) + 1; });

const canvas = document.getElementById('heatmapChart');
const ctx = canvas.getContext('2d');
const rect = canvas.parentElement.getBoundingClientRect();
canvas.width = rect.width - 48;
canvas.height = 140;

const cellSize = 12, gap = 3;
const oneYearAgo = new Date(); oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
const startDay = new Date(oneYearAgo); startDay.setDate(startDay.getDate() - startDay.getDay());

const dayLabels = ['', 'Lun', '', 'Mié', '', 'Vie', ''];
dayLabels.forEach((l, i) => { ctx.fillStyle = '#888'; ctx.font = '10px -apple-system, sans-serif'; ctx.fillText(l, 0, 28 + i * (cellSize + gap)); });

let col = 0; const offsetX = 30; let prevMonth = -1; const today = new Date();
for (let d = new Date(startDay); d <= today; d.setDate(d.getDate() + 1)) {
  const dow = d.getDay();
  const key = d.toISOString().slice(0, 10);
  const count = dayMap[key] || 0;
  if (dow === 0 && d > startDay) col++;
  if (d.getMonth() !== prevMonth && dow <= 1) {
    ctx.fillStyle = '#888'; ctx.font = '10px -apple-system, sans-serif';
    ctx.fillText(d.toLocaleDateString('es-AR', { month: 'short' }), offsetX + col * (cellSize + gap), 10);
    prevMonth = d.getMonth();
  }
  ctx.fillStyle = count === 0 ? '#1a1a1a' : count === 1 ? '#6366f166' : count === 2 ? '#6366f1aa' : '#6366f1';
  ctx.beginPath(); ctx.roundRect(offsetX + col * (cellSize + gap), 18 + dow * (cellSize + gap), cellSize, cellSize, 2); ctx.fill();
}
</script>
